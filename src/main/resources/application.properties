# Nombre de la aplicación
spring.application.name=planillero-backend

# Soporte para proxies inversos (Tomcat RemoteIpValve para NGINX / Docker)
server.forward-headers-strategy=native

# Configuración de conexión PostgreSQL (OWASP A05: parametrización por variables de entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/planillero}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:planillero}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:planillero}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del pool de conexiones HikariCP (resiliencia y timeouts)
spring.datasource.hikari.pool-name=PlanilleroHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Migraciones Flyway
spring.flyway.enabled=true
spring.flyway.schemas=public,core,visits,forms,audit,visitas,formularios,auditoria
spring.flyway.default-schema=public

# Configuración de Spring Data JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=core

# JWT propio (RS256).
app.jwt.issuer=${JWT_ISSUER:planillero-backend}
app.jwt.access-token-ttl=${JWT_ACCESS_TTL:PT15M}
app.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:P7D}
app.jwt.challenge-token-ttl=${JWT_CHALLENGE_TTL:PT5M}
#
# En desarrollo no se configuran claves: la aplicación genera un par efímero en memoria y avisa por
# log (los tokens dejan de valer al reiniciar). Un entorno real define estos dos recursos con claves
# provistas por el entorno; esas claves NUNCA se versionan.
#app.jwt.private-key=classpath:jwt/private.pem
#app.jwt.public-key=classpath:jwt/public.pem

# Control de fuerza bruta sobre el login: intentos fallidos permitidos dentro de la ventana.
app.auth.max-attempts=${AUTH_MAX_ATTEMPTS:5}
app.auth.attempt-window=${AUTH_ATTEMPT_WINDOW:PT15M}

# Almacenamiento pericial WORM (Write Once, Read Many) y MinIO / S3
app.storage.type=${STORAGE_TYPE:local}
app.storage.local-dir=${STORAGE_LOCAL_DIR:target/storage}
app.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.storage.minio.bucket=${MINIO_BUCKET:evidence}

# Clave simétrica para firma y sellado de manifiestos con HMAC-SHA256
app.crypto.hmac-secret=${HMAC_SECRET:dev-secret-key-for-manifest-hmac-sha256-signature-32bytes}