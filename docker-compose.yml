# Entorno integral de Planillero: PostgreSQL, MinIO, backend (Spring Boot) y backoffice (Angular
# sobre NGINX).
#
# Uso:
#   cp .env.example .env
#   docker compose up --build
#
# Asume los tres repos clonados como carpetas hermanas (backend/, backoffice/, frontend/), como
# en el workspace del proyecto: el build del backoffice usa el contexto `../backoffice`.
#
# RabbitMQ y Ollama quedan afuera a propósito (decisión de MVP: TASK-10 y TASK-13 son Post-MVP).
name: planillero

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB (copiá .env.example a .env)}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
    ports:
      # Publicado sólo en loopback: es para desarrollo, no para otras máquinas de la red.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - planillero-pgdata:/var/lib/postgresql/data
    networks:
      - planillero-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # Docker Hub (minio/minio) ya no publica imágenes: se usa quay.io con un tag fijo, no `latest`.
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?falta MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?falta MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - planillero-miniodata:/data
    networks:
      - planillero-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Job de una sola vez: crea el bucket de evidencias y termina (no cuenta como servicio "healthy").
  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-evidence}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET}
      "
    networks:
      - planillero-net
    restart: "no"

  backend:
    <<: *hardening
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      HMAC_SECRET: ${HMAC_SECRET:?falta HMAC_SECRET (mínimo 32 caracteres)}
      # Hoy las evidencias van a disco; el volumen las hace sobrevivir a un `down`.
      STORAGE_TYPE: local
      STORAGE_LOCAL_DIR: /app/storage
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-evidence}
      # Sin claves JWT configuradas el backend genera un par efímero: los tokens dejan de valer
      # al reiniciar el contenedor. Un entorno real inyecta claves propias.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - planillero-storage:/app/storage
    networks:
      - planillero-net
    healthcheck:
      # La imagen JRE Alpine no trae curl; busybox wget sí. /health es público.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  backoffice:
    <<: *hardening
    build:
      context: ../backoffice
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8080"
    networks:
      - planillero-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

networks:
  planillero-net:
    driver: bridge

volumes:
  planillero-pgdata:
  planillero-miniodata:
  planillero-storage:
